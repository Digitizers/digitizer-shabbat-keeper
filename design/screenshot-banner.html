<!-- Business mode: the plugin's banner and refusal styles (the real stylesheet) over a stand-in shop page. -->
<html lang="he-IL" dir="rtl">
<link rel="stylesheet" href="../assets/closed.css">
<style>
  body{margin:0;background:#fff;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 56px;border-bottom:1px solid #e6e8eb}
  header b{font-size:22px} nav{display:flex;gap:28px;color:#52606d;font-size:15px}
  .p{display:grid;grid-template-columns:420px 1fr;gap:56px;padding:48px 56px}
  .img{height:420px;border-radius:14px;background:linear-gradient(135deg,#f3d9a4,#e8b96a)}
  h1{font-size:34px;margin:0 0 10px} .price{font-size:24px;margin:0 0 18px} .d{font-size:16px;line-height:1.7;color:#52606d;max-width:520px;margin:0 0 26px}
  .button{display:inline-block;padding:14px 26px;border-radius:8px;background:#1f2933;color:#fff;font-size:16px}
  .digitizer-sk-closed-form{max-width:520px;margin-top:22px}
</style>
<body>
<div class="digitizer-sk-banner" role="status">האתר סגור לשבת. הזמנות וטפסים ייפתחו מחדש בשבת 19:32.</div>
<header><b>המאפייה של רות</b><nav><span>חנות</span><span>על המאפייה</span><span>צור קשר</span></nav></header>
<div class="p">
	<div class="img"></div>
	<div>
		<h1>חלה מתוקה לשבת</h1>
		<p class="price">₪24</p>
		<p class="d">חלה קלועה בעבודת יד, נאפית כל יום שישי בבוקר. אפשר לקרוא על המוצר גם עכשיו; ההזמנות ייפתחו מחדש במוצאי שבת.</p>
		<span class="button digitizer-sk-closed">האתר סגור לשבת</span>
		<div class="digitizer-sk-closed-form"><p>האתר סגור לשבת. הזמנות וטפסים ייפתחו מחדש בשבת 19:32.</p></div>
	</div>
</div>
</body>
</html>
