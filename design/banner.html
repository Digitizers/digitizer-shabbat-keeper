<style>
  html,body{margin:0;padding:0}
  .b{position:relative;width:772px;height:250px;overflow:hidden;
     background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
     font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  .grid{position:absolute;inset:0;opacity:.05;
     background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
     background-size:50px 50px}
  .glow{position:absolute;border-radius:50%;background:#f59e0b;filter:blur(60px)}
  .g1{width:260px;height:260px;right:-60px;top:-90px;opacity:.22}
  .g2{width:200px;height:200px;left:-80px;bottom:-90px;opacity:.09}
  .wrap{position:absolute;left:52px;top:44px;display:flex;gap:30px;align-items:flex-start}
  .mark{width:92px;height:92px;flex:none}
  .kicker{font-size:13px;letter-spacing:2.6px;font-weight:600;color:#f59e0b;text-transform:uppercase;margin:2px 0 12px}
  .h{font-size:27px;line-height:1.24;font-weight:700;color:#fff;letter-spacing:-.4px;margin:0}
  .h em{font-style:normal;color:#94a3b8}
  .rule{width:64px;height:3px;border-radius:2px;background:#f59e0b;opacity:.7;margin-top:18px}
  .chips{position:absolute;right:44px;top:78px;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
  .chip{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
        border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.5);
        font-size:13px;font-weight:600;letter-spacing:.3px;color:#cbd5e1}
  .chip b{font-size:15px;font-weight:700;color:#e2e8f0;letter-spacing:0}
  .chip .tag{font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
  .shut .tag{color:#fbbf24}
  .open .tag{color:#94a3b8}
  .dot{width:7px;height:7px;border-radius:50%}
  .shut .dot{background:#fbbf24}
  .open .dot{background:#64748b}
</style>
<div class="b">
  <div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <path d="M 92 58 C 106 78 106 96 92 104 C 78 96 78 78 92 58 Z" fill="#f59e0b"/>
      <path d="M 164 58 C 178 78 178 96 164 104 C 150 96 150 78 164 58 Z" fill="#f59e0b"/>
      <rect x="78"  y="116" width="28" height="84" rx="8" fill="#fff"/>
      <rect x="150" y="116" width="28" height="84" rx="8" fill="#fff" opacity="0.72"/>
      <rect x="58" y="206" width="140" height="13" rx="6.5" fill="#f59e0b" opacity="0.85"/>
    </svg>
    <div>
      <div class="kicker">Digitizer Shabbat Keeper</div>
      <p class="h">Closed for Shabbat.<br><em>Open again at Havdalah.</em></p>
      <div class="rule"></div>
    </div>
  </div>
  <div class="chips">
    <div class="chip shut"><span class="dot"></span><b>Friday 18:10</b><span class="tag">closes</span></div>
    <div class="chip open"><span class="dot"></span><b>Saturday 19:32</b><span class="tag">reopens</span></div>
  </div>
</div>
